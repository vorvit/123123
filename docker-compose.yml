version: '3.8'

services:
  postgres:
    image: postgres:13
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - ./db/.db.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  init:
      image: python:3.9-slim
      volumes:
        - ./backend:/app
      working_dir: /app
      depends_on:
        postgres:
          condition: service_healthy
      command: >
        sh -c "pip install -r requirements.txt && python init_db.py"

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      DB_HOST: ${DB_HOST}
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 45s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "8189:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata: